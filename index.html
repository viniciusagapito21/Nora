<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nora</title>
<meta name="theme-color" content="#F7F5EF">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<style>
  /* casca mínima da página; o resto do visual está em styles.css */
  body { margin: 0; min-height: 100vh; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <section class="view fin" id="fin-app" aria-label="Finanças"><p class="nota-pe">Carregando…</p></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden><span class="dot" aria-hidden="true"></span><span id="toast-txt"></span></div>

<script>
  /* aviso rápido usado pelo painel (salvou, importou, erro) */
  (function () {
    var el = document.getElementById('toast'), txt = document.getElementById('toast-txt'), t;
    window.__cortexToast = function (msg, erro, ms) {
      txt.textContent = msg;
      el.classList.toggle('erro', !!erro);
      el.hidden = false;
      clearTimeout(t);
      t = setTimeout(function () { el.hidden = true; }, ms || 6000);
    };
  })();
</script>
<script src="rules/ie.js"></script>
<script src="rules/br.js"></script>
<script src="app.js"></script>
</body>
</html>
