<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400..700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* casca mínima da página; o resto do visual está em styles.css */
  body { margin: 0; min-height: 100vh; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <section class="view fin" id="fin-app" aria-label="Finanças"><p class="nota-pe">Carregando…</p></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden><span class="dot" aria-hidden="true"></span><span id="toast-txt"></span></div>

<script src="config.js"></script>
<script>
  /* aviso rápido usado pelo painel (salvou, importou, erro) */
  (function () {
    var el = document.getElementById('toast'), txt = document.getElementById('toast-txt'), t;
    window.__cortexToast = function (msg, erro, ms) {
      txt.textContent = msg;
      el.classList.toggle('erro', !!erro);
      el.hidden = false;
      clearTimeout(t);
      t = setTimeout(function () { el.hidden = true; }, ms || 6000);
    };
  })();
</script>
<script src="app.js"></script>
</body>
</html>
